services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      KROGER_CLIENT_ID: ${KROGER_CLIENT_ID:-}
      KROGER_CLIENT_SECRET: ${KROGER_CLIENT_SECRET:-}
      KROGER_REDIRECT_URI: ${KROGER_REDIRECT_URI:-http://localhost:3000/auth/kroger/callback}
      KROGER_LOCATION_ID: ${KROGER_LOCATION_ID:-}
      YOUTUBE_MCP_URL: http://youtube-mcp:8100/mcp/
      YOUTUBE_SERVICE_URL: http://youtube-mcp:8100
      KROGER_MCP_URL: http://kroger-mcp:8000/mcp/
      KROGER_SIDECAR_URL: http://kroger-mcp:8000
    depends_on:
      - youtube-mcp
      - kroger-mcp
    ports:
      - "3000:3000"

  youtube-mcp:
    build:
      context: ./youtube-mcp
      dockerfile: Dockerfile
    environment:
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
    ports:
      - "8100:8100"

  kroger-mcp:
    build:
      context: ./kroger-mcp
      dockerfile: Dockerfile
    environment:
      KROGER_CLIENT_ID: ${KROGER_CLIENT_ID:-}
      KROGER_CLIENT_SECRET: ${KROGER_CLIENT_SECRET:-}
      KROGER_REDIRECT_URI: ${KROGER_REDIRECT_URI:-http://localhost:3000/auth/kroger/callback}
      KROGER_LOCATION_ID: ${KROGER_LOCATION_ID:-}
    volumes:
      - kroger_mcp_data:/app/data
    ports:
      - "8000:8000"

volumes:
  kroger_mcp_data:
