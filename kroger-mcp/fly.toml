# CraveCart: run Kroger MCP off Google Cloud to avoid Akamai 403 on GET /v1/products from GCP egress.
# See docs/deploy-cloud-run.md → “Hybrid: Kroger MCP outside Cloud Run”.
#
# Prefer `deploy-fly.ps1` (uses GCP Secret Manager with -FromGcpSecretManager; prod must not use repo .env).
# After `fly auth login`, from kroger-mcp/:
#   .\deploy-fly.ps1 -KrogerRedirectUri "https://YOUR_WEB.run.app/auth/kroger/callback" -FromGcpSecretManager -GcpProject YOUR_PROJECT
# Manual: fly secrets set ... then fly deploy
#
app = "cravecart-kroger-mcp"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

# Persist OAuth session JSON (same paths as compose volume).
# On first deploy Fly can create the volume if missing (see initial_size).
[mounts]
  source = "kroger_mcp_data"
  destination = "/app/data"
  initial_size = "1gb"
