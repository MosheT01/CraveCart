name: Deploy main → GCP Cloud Run + Fly

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

# Sensitive deploy inputs use Actions *secrets* (shown as *** in logs), not *variables*,
# which are echoed plainly in workflow expansion. Local fly.toml slug may still be visible in-repo.
# See docs/deploy-cloud-run.md → migration from Variables → Secrets.

jobs:
  deploy-gcp-then-fly:
    runs-on: ubuntu-latest
    env:
      CLOUDSDK_VERBOSITY: error

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate CI configuration
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          KROGER_LOCATION_ID: ${{ secrets.KROGER_LOCATION_ID }}
          EXTERNAL_KROGER_SIDECAR_URL: ${{ secrets.EXTERNAL_KROGER_SIDECAR_URL }}
        run: |
          set -euo pipefail
          test -n "${GCP_PROJECT_ID:-}" || { echo "Missing Actions secret GCP_PROJECT_ID." >&2; exit 1; }
          test -n "${KROGER_LOCATION_ID:-}" || { echo "Missing Actions secret KROGER_LOCATION_ID." >&2; exit 1; }
          test -n "${EXTERNAL_KROGER_SIDECAR_URL:-}" || { echo "Missing Actions secret EXTERNAL_KROGER_SIDECAR_URL." >&2; exit 1; }

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        if: ${{ vars.GCP_USE_WIF == 'true' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Authenticate to Google Cloud (service account key)
        if: ${{ vars.GCP_USE_WIF != 'true' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      # Pin one Secret Manager *version* ID for INTERNAL_SIDECAR_SECRET for the entire job. Cloud Build fixes that
      # revision on cravecart-web; Fly import reads the same version. Without this, a new ":latest" between the
      # two steps causes recurring Bearer 403 on the Kroger MCP.
      - name: Pin INTERNAL_SIDECAR_SECRET version (Cloud Run + Fly)
        id: sidecar_secret_version
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          RESOURCE="$(gcloud secrets versions describe latest --secret=INTERNAL_SIDECAR_SECRET --project="${GCP_PROJECT_ID}" --format='value(name)')"
          VID="${RESOURCE##*/}"
          echo "Pinned INTERNAL_SIDECAR_SECRET to one Secret Manager revision for this workflow run (Cloud Build + Fly)."
          echo "version=${VID}" >> "${GITHUB_OUTPUT}"

      - name: Submit Cloud Build (web + youtube MCP + Artifact Registry images)
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          KROGER_LOCATION_ID: ${{ secrets.KROGER_LOCATION_ID }}
          EXTERNAL_KROGER_SIDECAR_URL: ${{ secrets.EXTERNAL_KROGER_SIDECAR_URL }}
          KROGER_API_HOST: ${{ secrets.KROGER_API_HOST }}
        run: |
          set -euo pipefail
          SUBS="_AR_HOSTNAME=us-central1-docker.pkg.dev,_AR_REPO=cravecart,_KROGER_LOCATION_ID=${KROGER_LOCATION_ID},_EXTERNAL_KROGER_SIDECAR_URL=${EXTERNAL_KROGER_SIDECAR_URL},_INTERNAL_SIDECAR_SECRET_VERSION=${{ steps.sidecar_secret_version.outputs.version }}"
          if [[ -n "${KROGER_API_HOST:-}" ]]; then
            SUBS="${SUBS},_KROGER_API_HOST=${KROGER_API_HOST}"
          fi
          gcloud builds submit \
            --config=cloudbuild.yaml \
            --project="${GCP_PROJECT_ID}" \
            --substitutions="${SUBS}"

      - name: Set up Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@v1

      - name: Deploy Kroger MCP to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP: ${{ secrets.FLY_APP_NAME }}
          FLY_ORG: ${{ vars.FLY_ORG }}
          GCP_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REGION: us-central1
          INTERNAL_SIDECAR_SECRET_VERSION: ${{ steps.sidecar_secret_version.outputs.version }}
          EXTERNAL_KROGER_SIDECAR_URL: ${{ secrets.EXTERNAL_KROGER_SIDECAR_URL }}
        run: |
          set -euo pipefail
          test -n "${FLY_API_TOKEN:-}" || { echo "Missing Actions secret FLY_API_TOKEN." >&2; exit 1; }
          test -n "${FLY_APP:-}" || { echo "Missing Actions secret FLY_APP_NAME (Fly Machines app slug); set it to override fly.toml without logging the slug." >&2; exit 1; }
          bash kroger-mcp/deploy-fly-ci.sh
